<!DOCTYPE html>
<html>
<head>
  
<title>dinnerladies JEANS</title>
<link rel="icon" href="favicon.png">

<style>
  html, body {
    margin: 0;
    height: 200vh;
    overscroll-behavior: none;
    background-color: #1c2533;
    color: white;
    font-family: "Myriad Pro", sans-serif;
    font-size: 100px;
    letter-spacing: -0.7px;
  }

  .bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100lvh;
    background-image: url("denim-texture_page-0001.jpg");
    background-size: cover;
    background-position: center;
    transform: scale(1.25);
    pointer-events: none;
  }

  .artist {
    position: absolute;
    top: 42px;
    left: 12px;
    mix-blend-mode: overlay;
  }

  .album {
    position: absolute;
    top: calc(100vh - 140px);
    right: 32px;
    mix-blend-mode: overlay;
  }

  .star {
    position: absolute;
    top: 150vh;
    left: 50%;
    transform: translate(-50%, -50%);
    mix-blend-mode: overlay;
    cursor: pointer;
    transition: opacity 1s;
  }

  @media (max-width: 600px) {
    body {
      font-size: 48px;
    }

    .album {
      top: calc(100vh - 80px);
    }
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="artist">dinnerladies</div>
<div class="album">JEANS</div>
<div class="star" onclick="document.getElementById('s').play(); this.style.opacity = 0;">&#9733;</div>
<audio id="s" src="song1.mp3"></audio>

</body>

</html>
