<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>dinnerladies JEANS</title>
<link rel="icon" href="favicon.png">

<style>
  html, body {
    margin: 0;
    background-color: #1c2533;
  }

  body {
    height: 200vh;
    color: white;
    font-family: "Myriad Pro", sans-serif;
    font-size: 100px;
    letter-spacing: -0.7px;
  }

  .bg {
    position: fixed;
    top: -15vh;
    left: 0;
    width: 100vw;
    height: 130vh;
    background: url("denim-texture_page-0001.jpg") center / cover;
    transform: scale(1.4);
    pointer-events: none;
  }

  .artist {
    position: absolute;
    top: 42px;
    left: 12px;
    mix-blend-mode: overlay;
  }

  .album {
    position: absolute;
    top: calc(100vh - 140px);
    right: 32px;
    mix-blend-mode: overlay;
  }

  .star {
    position: absolute;
    top: 150vh;
    left: 50%;
    transform: translate(-50%, -50%);
    mix-blend-mode: overlay;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 1s;
  }

  @media (max-width: 600px) {
    body {
      font-size: 48px;
    }

    .album {
      top: calc(100vh - 80px);
    }
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="artist">dinnerladies</div>
<div class="album">JEANS</div>
<div class="star" id="star">★</div>
<audio id="s" src="bumpy-ride.mp3" playsinline></audio>

<script>
  document.getElementById('star').onclick = function () {
    document.getElementById('s').play();
    this.style.opacity = 0;
  };
</script>

</body>
  
</html>
