
<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>dinnerladies JEANS</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    background: #1c2533;
  }

  body {
    height: 200vh;
    color: #101b2a;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 400;
    letter-spacing: -1.5px;
  }

  .bg {
    position: fixed;
    top: -15vh;
    left: 0;
    width: 100vw;
    height: 130vh;
    background: url("denim-texture_page-0001.jpg") center / cover;
    transform: scale(1.4);
    pointer-events: none;
  }

  .artist {
    position: absolute;
    top: 42px;
    left: 22px;

    font-size: clamp(25px, 4.5vw, 52px);
    font-weight: 400;
    letter-spacing: -2px;

    color: #101b2a;
    mix-blend-mode: soft-light;

    text-shadow:
      1px 1px 2px rgba(255,255,255,0.12),
      -1px -1px 2px rgba(0,0,0,0.25);
  }

  .album {
    position: absolute;
    top: calc(100vh - 155px);
    right: 30px;

    font-size: clamp(65px, 11vw, 125px);
    font-weight: 400;
    letter-spacing: -5px;

    color: #101b2a;
    mix-blend-mode: soft-light;

    text-shadow:
      1px 1px 2px rgba(255,255,255,0.12),
      -1px -1px 2px rgba(0,0,0,0.3);
  }

  .star {
    position: absolute;
    top: 150vh;
    left: 50%;
    transform: translate(-50%, -50%);

    font-size: 32px;
    font-weight: 300;
    color: #101b2a;
    mix-blend-mode: soft-light;

    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 1s;
  }

  @media (max-width: 600px) {

    .artist {
      top: 25px;
      left: 14px;
      font-size: 29px;
      letter-spacing: -1.5px;
    }

    .album {
      top: calc(100vh - 100px);
      right: 16px;
      font-size: 68px;
      letter-spacing: -3px;
    }

    .star {
      font-size: 25px;
    }
  }

</style>
</head>

<body>

<div class="bg"></div>

<div class="artist">dinnerladies</div>

<div class="album">JEANS</div>

<div class="star" id="star">✳</div>

<audio id="s" src="bumpy-ride.m4a" preload="auto" playsinline></audio>

<script>
  const audio = document.getElementById('s');
  const star = document.getElementById('star');

  star.addEventListener('click', async function () {
    try {
      await audio.play();
      star.style.opacity = 0;
    } catch (err) {
      console.error('Audio failed:', err);
      alert('Audio error: ' + err.name);
    }
  });
</script>

</body>
</html>
