<!DOCTYPE html>
<html>
<head>
  
<title>dinnerladies JEANS</title>
<link rel="icon" href="favicon.png">

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #1c2533;
    color: white;
    font-family: "Myriad Pro", sans-serif;
    font-size: 64px;
    letter-spacing: -0.7px;
    user-select: none;
  }

  canvas {
    display: block;
    cursor: grab;
  }

  canvas:active {
    cursor: grabbing;
  }

  .artist {
    position: absolute;
    top: 42px;
    left: 12px;
    mix-blend-mode: overlay;
    pointer-events: none;
  }

  .album {
    position: absolute;
    bottom: 24px;
    right: 32px;
    mix-blend-mode: overlay;
    pointer-events: none;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="artist">dinnerladies</div>
<div class="album">JEANS</div>

<script>
  var c = document.getElementById("c");
  var ctx = c.getContext("2d");
  var img = new Image();
  img.src = "denim-texture_page-0001.jpg";

  var grid = 32;
  var pts = [];
  var mouse = { x: 0, y: 0, down: false };

  function resize() {
    c.width = window.innerWidth;
    c.height = window.innerHeight;
    pts = [];
    for (var y = 0; y <= grid; y++) {
      for (var x = 0; x <= grid; x++) {
        var px = (x / grid) * c.width;
        var py = (y / grid) * c.height;
        pts.push({ x: px, y: py, ox: px, oy: py, vx: 0, vy: 0 });
      }
    }
  }

  window.onresize = resize;
  c.onpointerdown = function(e) { mouse.down = true; mouse.x = e.clientX; mouse.y = e.clientY; };
  window.onpointermove = function(e) { mouse.x = e.clientX; mouse.y = e.clientY; };
  window.onpointerup = function() { mouse.down = false; };

  function draw() {
    ctx.clearRect(0, 0, c.width, c.height);

    for (var i = 0; i < pts.length; i++) {
      var p = pts[i];
      if (mouse.down) {
        var dx = mouse.x - p.x;
        var dy = mouse.y - p.y;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d < 150) {
          var pull = (150 - d) / 150;
          p.vx += dx * pull * 0.08;
          p.vy += dy * pull * 0.08;
        }
      }
      p.vx += (p.ox - p.x) * 0.06;
      p.vy += (p.oy - p.y) * 0.06;
      p.vx *= 0.85;
      p.vy *= 0.85;
      p.x += p.vx;
      p.y += p.vy;
    }

    if (img.complete && img.width > 0) {
      var scale = Math.max(c.width / img.width, c.height / img.height);
      var sw = c.width / scale;
      var sh = c.height / scale;
      var sx = (img.width - sw) / 2;
      var sy = (img.height - sh) / 2;

      for (var y = 0; y < grid; y++) {
        for (var x = 0; x < grid; x++) {
          var p1 = pts[y * (grid + 1) + x];
          var p2 = pts[y * (grid + 1) + x + 1];
          var p3 = pts[(y + 1) * (grid + 1) + x];
          ctx.drawImage(
            img,
            sx + (x / grid) * sw, sy + (y / grid) * sh, sw / grid, sh / grid,
            p1.x, p1.y, p2.x - p1.x + 1, p3.y - p1.y + 1
          );
        }
      }
    }

    requestAnimationFrame(draw);
  }

  resize();
  img.onload = draw;
</script>

</body>
</html>
