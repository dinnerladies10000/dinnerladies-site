
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>dinnerladies — JEANS</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background-color: #a9cce3;

      /* Subtle denim weave */
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent 0px,
          rgba(255,255,255,0.09) 1px,
          transparent 2px,
          transparent 4px
        ),
        repeating-linear-gradient(
          90deg,
          transparent 0px,
          rgba(35,75,110,0.10) 1px,
          transparent 2px,
          transparent 4px
        ),
        linear-gradient(
          135deg,
          #b5d5e9,
          #91b9d6
        );

      color: #171717;
      font-family: Arial, Helvetica, sans-serif;
    }

    .name {
      position: absolute;
      top: 25px;
      left: 30px;
      font-size: 16px;
      font-weight: 400;
      letter-spacing: -0.7px;
    }

    .album {
      position: absolute;
      bottom: 25px;
      right: 30px;
      font-size: 16px;
      font-weight: 400;
      letter-spacing: -0.7px;
    }

  </style>
</head>

<body>

  <div class="name">dinnerladies</div>

  <div class="album">JEANS</div>

</body>
</html>
