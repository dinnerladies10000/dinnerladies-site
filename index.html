<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>dinnerladies — JEANS</title>
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background-color: #1c2533;

      /* Your uploaded image */
      background-image: url("denim-texture_page-0001.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      font-family: Arial, Helvetica, sans-serif;
    }

    /* Embossed / debossed denim text effect */
    .name,
    .album {
      position: absolute;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.4px;
      
      /* Slightly darker than the denim weave so it looks pressed in */
      color: rgba(12, 17, 26, 0.85);
      
      /* Top-left inner shadow + bottom-right fabric catchlight */
      text-shadow: 
        -1px -1px 1px rgba(0, 0, 0, 0.9),
         1px  1px 1px rgba(175, 195, 225, 0.35);
    }

    .name {
      top: 25px;
      left: 30px;
    }

    .album {
      bottom: 25px;
      right: 30px;
    }

  </style> 
</head>

<body>

  <div class="name">dinnerladies</div>

  <div class="album">JEANS</div>

</body>
</html>
