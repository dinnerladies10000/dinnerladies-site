<!DOCTYPE html>

<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>dinnerladies JEANS</title>
<link rel="icon" href="favicon.png">

<style>
  html, body {
    margin: 0;
    background-color: #1c2533;
  }

  body {
    height: 200vh;
    font-family: "Myriad Pro", sans-serif;
    font-size: 100px;
    letter-spacing: -0.7px;
  }

  .bg {
    position: fixed;
    top: -15vh;
    left: 0;
    width: 100vw;
    height: 130vh;
    background: url("denim-texture_page-0001.jpg") center / cover;
    transform: scale(1.4);
    pointer-events: none;
  }

  .artist, .album, .star {
    /* Darker semi-transparent fill lets the denim texture show through */
    color: rgba(15, 22, 34, 0.55);
    mix-blend-mode: hard-light;
    /* Crisp top-left inner shadow + crisp bottom-right highlight rim */
    text-shadow: 
      -1px -1px 0px rgba(0, 0, 0, 0.85),
       1px  1px 0px rgba(255, 255, 255, 0.35);
  }

  .artist {
    position: absolute;
    top: 42px;
    left: 12px;
  }

  .album {
    position: absolute;
    top: calc(100vh - 140px);
    right: 32px;
  }

  .star {
    position: absolute;
    top: 150vh;
    left: 50%;
    transform: translate(-50%, -50%);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 1s;
  }

  @media (max-width: 600px) {
    body {
      font-size: 48px;
    }

    .album {
      top: calc(100vh - 80px);
    }
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="artist">dinnerladies</div>
<div class="album">JEANS</div>
<div class="star" id="star">★</div>
<audio id="s" src="bumpy-ride.m4a" preload="auto" playsinline></audio>

<script>
  const audio = document.getElementById('s');
  const star = document.getElementById('star');

  star.addEventListener('click', async function () {
    try {
      await audio.play();
      star.style.opacity = 0;
    } catch (err) {
      console.error('Audio failed:', err);
      alert('Audio error: ' + err.name + ' / code ' + (audio.error ? audio.error.code : 'none'));
    }
  });
</script>

</body>
  
</html>
